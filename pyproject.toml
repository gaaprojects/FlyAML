[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyconn"
version = "0.1.0"
description = "Connectomics network statistics (reciprocity, rich club, motifs, integrator/broadcaster) applied to the IBM synthetic AML transaction graph"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gaspar Astorga" }]
keywords = ["aml", "graph-analytics", "connectomics", "igraph", "network-science"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "python-igraph>=0.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/gaaprojects/FlyAML"

[tool.setuptools]
packages = ["moneyconn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
